<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relax Vibe | Demo Admin</title><style>
body{font-family:system-ui,Arial;margin:0;background:#f5f7f6;color:#172532}header{background:#12283a;color:white;padding:20px}main{max-width:950px;margin:30px auto;padding:0 18px}.box{background:white;border:1px solid #e2e9e5;border-radius:16px;padding:20px;margin:15px 0}.muted{color:#64748b;font-size:.9rem}button{padding:9px 13px;border:0;border-radius:9px;background:#12283a;color:white;cursor:pointer;margin:4px}button.reject{background:#9b3c3c}.item{border-top:1px solid #e5eae7;padding:15px 0}.pill{font-size:.78rem;background:#e8f5ed;padding:5px 9px;border-radius:30px}</style></head><body><header><strong>Relax Vibe</strong> · Demo Admin Dashboard</header><main><h1>Business submissions</h1><p class="muted">This demo dashboard reads submissions saved in this same browser only. It is not a secure admin system and cannot manage submissions from other devices.</p><div class="box"><strong id="count">0 submissions</strong><div id="items" class="muted" style="margin-top:12px">No submissions yet.</div></div><p><a href="index.html">← Back to website</a></p></main><script>
const key='rv_submissions_demo';function draw(){let a=JSON.parse(localStorage.getItem(key)||'[]');document.getElementById('count').textContent=a.length+' submissions';let root=document.getElementById('items');root.innerHTML='';if(!a.length){root.textContent='No submissions yet.';return}a.forEach((x,i)=>{let d=document.createElement('div');d.className='item';let h=document.createElement('h3');h.textContent=x.business+' — '+x.city;let p=document.createElement('p');p.textContent=[x.owner,x.category,x.address,x.phone,x.whatsapp,x.offer].filter(Boolean).join(' · ');let s=document.createElement('span');s.className='pill';s.textContent=x.status;let approve=document.createElement('button');approve.textContent='Approve (demo)';approve.onclick=()=>{x.status='approved';localStorage.setItem(key,JSON.stringify(a));draw()};let reject=document.createElement('button');reject.className='reject';reject.textContent='Reject (demo)';reject.onclick=()=>{x.status='rejected';localStorage.setItem(key,JSON.stringify(a));draw()};d.append(h,p,s,approve,reject);root.append(d)})}draw();
</script></body></html>
